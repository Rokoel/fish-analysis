[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fish-viewer"
version = "0.9.1"
description = "Desktop viewer for Imaris microscopy images and saved cell annotations"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.7,<7",
  "pyvista>=0.46,<0.47",
  "pyvistaqt>=0.11,<0.12",
  "vtk>=9.3,!=9.4.0,<9.6",
  "numpy>=1.26,<3",
  "h5py>=3.11,<4",
  "tifffile>=2024.8",
  "imagecodecs>=2024.6",
  "scipy>=1.13,<2",
  "scikit-image>=0.25,<0.27",
  "matplotlib>=3.8,<4",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
neural = ["stardist>=0.9.2,<0.10", "tensorflow>=2.20,<2.22"]
neural-gpu = ["stardist>=0.9.2,<0.10", "tensorflow[and-cuda]>=2.20,<2.22; sys_platform == 'linux'"]

[project.scripts]
fish-viewer = "fish_viewer.__main__:main"
fish-analysis = "fish_viewer.analysis.__main__:main"
fish-annotator = "fish_viewer.annotation.__main__:main"

[tool.setuptools.packages.find]
include = ["fish_viewer*"]

[tool.setuptools.package-data]
"fish_viewer.workflow" = ["templates/*.xml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: tests using local FISH data", "gui: offscreen GUI and rendering tests", "neural: real optional StarDist CPU training"]
filterwarnings = ["ignore:Setting the shape on a NumPy array has been deprecated:DeprecationWarning:vtkmodules.util.numpy_support"]
