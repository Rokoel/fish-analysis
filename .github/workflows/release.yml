name: Build and release FISH Analysis

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version label (must match pyproject.toml, e.g. v0.9.2)
        required: true
        type: string
      ref:
        description: Optional commit/tag to build (defaults to selected branch)
        required: false
        type: string
      publish:
        description: Publish verified binaries to the version tag
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      QT_QPA_PLATFORM: offscreen
      TF_CPP_MIN_LOG_LEVEL: '2'
      CUDA_VISIBLE_DEVICES: '-1'
      OMP_NUM_THREADS: '4'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-spots.txt
            requirements-build.txt
      - name: Install Linux graphics libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxkbcommon-x11-0 xvfb xz-utils
      - name: Make room for bundled Linux CUDA libraries
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
      - name: Install bundled CPU PyTorch runtime
        run: python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install application, inference and build dependencies
        run: python -m pip install -e ".[neural,test]" -r requirements-spots.txt -r requirements-build.txt
      - name: Test signal networks
        run: python -m pytest tests/test_signal_centers.py -q -k "not training_graphs"
      - name: Check tag and application version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python -c "import os,tomllib; v=tomllib.load(open('pyproject.toml','rb'))['project']['version']; assert os.environ['RELEASE_TAG']=='v'+v, 'Tag must equal v plus project version'"
      - name: Check Windows runtime bootstrap
        if: runner.os == 'Windows'
        shell: powershell
        run: ./setup-windows-runtime.ps1
      - name: Test readers, geometry, export and Excel
        run: python -m pytest -q -m "not neural and not gui and not integration"
      - name: Verify bundled models on CPU
        run: python scripts/verify_release.py --require-latest-models --with-direct-signals
      - name: Check detector and contour losses on CPU
        run: python -m pytest -q tests/test_proposals.py tests/test_refinement.py tests/test_stardist2d_slices.py -m neural
      - name: Test annotation painting, fill, undo and persistence
        run: python -m pytest -q tests/test_annotation.py
      - name: Build source and model bundle
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: python scripts/package_analysis.py --output "dist/FISH-Analysis-${RELEASE_TAG}-${RELEASE_PLATFORM}"
      - name: Verify packaged models on CPU
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          cd "dist/FISH-Analysis-${RELEASE_TAG}-${RELEASE_PLATFORM}"
          python scripts/verify_release.py --require-latest-models --with-direct-signals
      - name: Build standalone executable
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          cuda_args=()
          if [ "$RUNNER_OS" = Linux ]; then
            python -m pip install --no-cache-dir -r requirements-cuda-bundle.txt
            python -m pip install --no-cache-dir --no-deps torch==2.9.1+cu128 torchvision==0.24.1+cu128 --index-url https://download.pytorch.org/whl/cu128
            cuda_args=(--cuda)
          fi
          python scripts/build_standalone.py --bundle "dist/FISH-Analysis-${RELEASE_TAG}-${RELEASE_PLATFORM}" --tag "$RELEASE_TAG" "${cuda_args[@]}"
      - name: Test installed executable outside the checkout
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RELEASE_PLATFORM: ${{ matrix.platform }}
        shell: python
        run: |
          import os, pathlib, subprocess, tempfile
          suffix = '.exe' if os.name == 'nt' else '.AppImage'
          binary = pathlib.Path(f'dist/FISH-Analysis-{os.environ["RELEASE_TAG"]}-{os.environ["RELEASE_PLATFORM"]}{suffix}').absolute()
          env = dict(os.environ, CUDA_VISIBLE_DEVICES='-1', OMP_NUM_THREADS='2', TF_NUM_INTRAOP_THREADS='2', TF_NUM_INTEROP_THREADS='1')
          for key in ('PYTHONPATH', 'PYTHONHOME', 'FISH_SPOTS_PYTHON', 'VIRTUAL_ENV'):
              env.pop(key, None)
          env['APPIMAGE_EXTRACT_AND_RUN'] = '1'
          env.pop('FISH_RUNTIME_DOWNLOAD_DIR', None)
          # Verify adjacent runtime-part discovery without an override or network.
          for key in ('HTTP_PROXY', 'HTTPS_PROXY', 'http_proxy', 'https_proxy'):
              env[key] = 'http://127.0.0.1:9'
          with tempfile.TemporaryDirectory(prefix='fish-installed-') as clean:
              env['XDG_CACHE_HOME'] = str(pathlib.Path(clean)/'cache')
              subprocess.run([str(binary), '--check-runtime', '--device', 'cpu'], cwd=clean, env=env, check=True, timeout=900)
              subprocess.run([str(binary), '--verify-models', '--require-latest-models', '--with-direct-signals'], cwd=clean, env=env, check=True, timeout=900)
              subprocess.run([str(binary), '--self-test', '--output', str(pathlib.Path(clean)/'smoke')], cwd=clean, env=env, check=True, timeout=900)
          # GitHub-hosted runners have no NVIDIA GPU; assert CUDA was compiled
          # and the libraries are present. GPU execution is verified separately.
          if os.name != 'nt':
              import torch, importlib.metadata
              assert torch.version.cuda is not None
              assert importlib.metadata.version('nvidia-cudnn-cu12')
              assert binary.stat().st_size < 2 * 1024**3, 'GitHub release asset exceeds 2 GiB'
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.exe
            dist/*.AppImage
            dist/*.build.json
            dist/*.runtime.part*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Publish tested release bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          (cd release-assets && sha256sum *.exe *.AppImage *.build.json *.runtime.part* > SHA256SUMS.txt)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "FISH Analysis $RELEASE_TAG" \
              --notes-file docs/release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag \
              --title "FISH Analysis $RELEASE_TAG" --notes-file docs/release-notes.md
          fi
